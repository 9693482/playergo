name: playergo
description: "PlayerGo - Plataforma para reserva y contratación de jugadores deportivos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Localization
  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^15.1.3

  # Supabase
  supabase_flutter: ^2.9.1

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.2
  crypto: ^3.0.3

  # Geolocation
  geolocator: ^14.0.0

  # Date/Time
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.5.3

  # Environment
  flutter_dotenv: ^5.2.0

  # Notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.9

  # Stripe
  flutter_stripe: ^11.4.1

  # Image
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Testing
  mocktail: ^1.0.4

  # Lint
  lint: ^2.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
